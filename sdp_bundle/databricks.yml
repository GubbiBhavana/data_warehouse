# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "databricks"

include:
  - resources/*.yml

variables:
  catalog:
    default: bhavana_practise
  schema:
    default: sdp
    
resources:
  jobs:
    employee_mv_job:
      name: employee_mv_job 
      tasks:
        - task_key: run_employee_pipeline
          pipeline_task: 
            pipeline_id: ${resources.pipelines.employee_pipeline.id}
      parameters:
        - name: id
          default: <MISSING>
        - name: name
          default: <MISSING>
      queue:
        enabled: true
        
git_source:
  git_url: https://github.com/GubbiBhavana/data_warehouse.git
  git_provider: gitHub
  git_branch: main